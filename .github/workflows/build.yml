
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        run: |
          set -euxo pipefail

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          test -d "$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi

          test -n "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Check project files
        run: |
          set -euxo pipefail

          test -f index.html

          echo "Repository files:"
          ls -la

      - name: Build Android APK
        run: |
          set -euxo pipefail

          npm install -g cordova

          cordova create app com.thermo.hmi "Thermoforming HMI"

          cd app

          cp ../index.html www/index.html

          if [ -f ../logo.png ]; then
            cp ../logo.png www/logo.png
          fi

          if [ -f ../icon.png ]; then
            cp ../icon.png icon.png
          fi

          # Configure Cordova without changing XML namespace
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = "config.xml"

          tree = ET.parse(path)
          root = tree.getroot()

          if root.tag.startswith("{"):
              namespace = root.tag.split("}")[0][1:]
              ET.register_namespace("", namespace)

          def tag(name):
              if root.tag.startswith("{"):
                  namespace = root.tag.split("}")[0][1:]
                  return "{" + namespace + "}" + name
              return name

          def set_preference(name, value):
              for item in root.findall(tag("preference")):
                  if item.get("name") == name:
                      item.set("value", value)
                      return

              ET.SubElement(
                  root,
                  tag("preference"),
                  {"name": name, "value": value}
              )

          set_preference("Orientation", "sensorLandscape")
          set_preference("Fullscreen", "true")
          set_preference("android-minSdkVersion", "24")
          set_preference("android-targetSdkVersion", "34")

          if os.path.isfile("icon.png"):
              for icon in root.findall(tag("icon")):
                  root.remove(icon)

              ET.SubElement(root, tag("icon"), {"src": "icon.png"})

          tree.write(
              path,
              encoding="UTF-8",
              xml_declaration=True
          )

          check = ET.parse(path).getroot()

          if not check.tag.endswith("widget"):
              raise SystemExit(
                  "ERROR: config.xml root element is not widget"
              )

          print("Cordova config.xml fixed successfully")
          PY

          # Add Android platform
          cordova platform add android@13.0.0

          # Add Arduino serial plugin
          cordova plugin add cordovarduino

          # Patch plugin Java compatibility
          python3 - <<'PY'
          import glob

          def rewrite(src, token, fn):
              out = ""
              i = 0

              while True:
                  j = src.find(token, i)

                  if j < 0:
                      return out + src[i:]

                  k = j + len(token)
                  depth = 1
                  p = k

                  while p < len(src) and depth:
                      if src[p] == "(":
                          depth += 1
                      elif src[p] == ")":
                          depth -= 1
                      p += 1

                  if depth:
                      return src

                  out += src[i:j] + fn(src[k:p-1])
                  i = p

          def split_args(s):
              args = []
              depth = 0
              cur = ""

              for ch in s:
                  if ch == "," and depth == 0:
                      args.append(cur.strip())
                      cur = ""
                      continue

                  if ch in "([{":
                      depth += 1
                  elif ch in ")]}":
                      depth -= 1

                  cur += ch

              args.append(cur.strip())
              return args

          def fix_pending(inner):
              args = split_args(inner)

              if len(args) != 4:
                  return "PendingIntent.getBroadcast(" + inner + ")"

              ctx, req, intent, flags = args

              if "setPackage" not in intent:
                  intent += ".setPackage(" + ctx + ".getPackageName())"

              if (
                  "0x02000000" not in flags
                  and "FLAG_MUTABLE" not in flags
                  and "FLAG_IMMUTABLE" not in flags
              ):
                  if flags in ("0", ""):
                      flags = "0x02000000"
                  else:
                      flags = "0x02000000 | " + flags

              return (
                  "PendingIntent.getBroadcast("
                  + ", ".join([ctx, req, intent, flags])
                  + ")"
              )

          def fix_receiver(inner):
              args = split_args(inner)

              if len(args) == 2:
                  return ".registerReceiver(" + inner + ", 4)"

              return ".registerReceiver(" + inner + ")"

          files = [
              f
              for f in (
                  glob.glob("plugins/**/*.java", recursive=True)
                  + glob.glob("platforms/**/*.java", recursive=True)
              )
              if "serial" in f.lower()
              or "drangies" in f.lower()
          ]

          changed = 0

          for filename in files:
              with open(
                  filename,
                  encoding="utf-8",
                  errors="ignore"
              ) as file:
                  original = file.read()

              if (
                  "PendingIntent" not in original
                  and "registerReceiver" not in original
              ):
                  continue

              updated = rewrite(
                  original,
                  "PendingIntent.getBroadcast(",
                  fix_pending
              )

              updated = rewrite(
                  updated,
                  ".registerReceiver(",
                  fix_receiver
              )

              if updated != original:
                  with open(
                      filename,
                      "w",
                      encoding="utf-8"
                  ) as file:
                      file.write(updated)

                  print("USB PATCH APPLIED:", filename)
                  changed += 1

          if changed == 0:
              print(
                  "WARNING: USB patch changed nothing. "
                  "Check plugin source if build fails."
              )
          PY

          cordova requirements android

          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thermoforming-hmi-apk
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
