# Thermoforming Machine HMI serial protocol
# Arduino Mega 2560 / USB serial
# Encoding: ASCII, newline terminated (\n or \r\n)
# Baud: 9600, 8 data bits, no parity, 1 stop bit

serial:
  baud_rate: 9600
  data_bits: 8
  parity: none
  stop_bits: 1
  line_ending: LF
  max_command_line_bytes: 23

phone_to_arduino:
  commands:
    MODE:
      formats:
        - "MODE,TEST"
        - "MODE,PRODUCTION"
      description: Select mode only in HOME/READY with all outputs off. TEST energizes real outputs and uses timer-based virtual limit responses; PRODUCTION uses physical limit switches.
      acknowledgement: "E,MODE,TEST or E,MODE,PRODUCTION"
    START:
      description: Request one cycle. Accepted only in READY; plug must be UP.
      response: Status line; start may be ignored if not READY.
    STOP:
      description: Stop outputs, clear software fault, return to HOME.
      response: Status line
    ESTOP:
      description: Software emergency-stop request; not safety-rated.
      response: E,FAULT,11 when accepted
    STATUS:
      description: Request immediate status report.
      response: S,state,output_mask,temp_ready,fault_code
    CFG:
      format: "CFG,<forming_seconds>,<cooling_seconds>"
      constraints:
        forming_seconds: 1..999
        cooling_seconds: 1..999
      example: "CFG,10,5"
      response_on_invalid: "E,ERR,CFG"

arduino_to_phone:
  status:
    format: "S,<state>,<output_mask>,<temp_ready>,<fault_code>"
    fields:
      state: State number below
      output_mask: Unsigned integer; bit i corresponds to output i
      temp_ready: 0 or 1
      fault_code: Fault number below
    period_ms: 200
  events:
    boot: "E,BOOT"
    cycle_complete: "E,CYCLE"
    fault: "E,FAULT,<fault_code>"
    invalid_command: "E,ERR,CMD"
    invalid_config: "E,ERR,CFG"
    invalid_mode: "E,ERR,MODE"
    mode_changed: "E,MODE,<TEST|PRODUCTION>"

states:
  0: HOME
  1: CLAMP_SHEET
  2: HEATER_POSITION
  3: HEATING
  4: HEATER_RETRACT
  5: MOLD_UP
  6: MOLD_UP_CONFIRM
  7: VACUUM_ON
  8: FORMING
  9: VACUUM_OFF
  10: COOLING
  11: MOLD_DOWN
  12: RELEASE
  13: PULLING
  14: CYCLE_DONE
  15: READY
  16: FAULT
  17: POWER_RECOVERY
  18: PLUG_DOWN
  19: PLUG_UP

fault_codes:
  0: NONE
  1: ESTOP
  2: CLAMP
  3: HEATER_IN
  4: HEAT_TIMEOUT
  5: HEATER_OUT
  6: MOLD_UP
  7: MOLD_UP_LOST
  8: MOLD_DOWN
  9: ROLLER
  10: POWER
  11: HMI_ESTOP
  12: PLUG_DOWN
  13: PLUG_UP
  14: PLUG_NOT_UP

output_bits:
  0: CLAMP_SOL
  1: HEATER_MOVE_IN
  2: HEATER_MOVE_OUT
  3: MOLD_DOWN_SOL
  4: MOLD_UP_SOL
  5: VACUUM_PUMP
  6: VACUUM_SOL
  7: RELEASE_SOL
  8: ALARM_BUZZER
  9: PLUG_SOL
  10: ROLLER_MOTOR

safety:
  - TEST mode uses real outputs; only limit-switch response is timer-virtual.
  - Do not allow mode changes while a cycle is active or any output is energized.
  - Software ESTOP is not safety-rated.
  - Physical emergency-stop must remove heater and actuator power independently.
  - Independent thermal fuse and appropriate guarding are required.
  - Test with outputs disconnected before commissioning.
