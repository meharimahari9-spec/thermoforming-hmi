name: Build Thermoforming HMI APK

on:
  workflow_dispatch: # ከ GitHub UI በእጅ ለማስኬድ ያስችላል
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Create Cordova Project Structure
        run: |
          # 1. የ directory መዋቅር መፍጠር
          mkdir -p temp_app
          cd temp_app
          
          # 2. Cordova Appን በ STRICTLY VALID Package Name መጀመር
          # ሁሉንም የተከለከሉ ቃላት ለማስወገድ ወደ com.gear.megacontrol ተቀይሯል።
          cordova create com.gear.megacontrol "Thermoforming HMI"
          
          # 3. ወደ project folder መግባት (ከላይ ካለው ID ጋር መመሳሰል አለበት)
          cd com.gear.megacontrol
          
          # 4. custom index.html-ዎን ወደ www folder መቅዳት
          cp ../../index.html ./www/index.html
          
          # 5. Android Platform መጨመር
          cordova platform add android@13
          
          # 6. Serial Plugin መጨመር (ለ USB ግንኙነት)
          cordova plugin add cordovarduino
          
          # 7. Preferences በ config.xml ውስጥ ማስተካከል
          sed -i 's#</widget>#<preference name="Orientation" value="landscape" />\n<preference name="Fullscreen" value="true" />\n<preference name="android-minSdkVersion" value="24" />\n<preference name="android-targetSdkVersion" value="30" />\n</widget>#' config.xml

      - name: Build Debug APK
        working-directory: temp_app/com.gear.megacontrol
        run: cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thermoforming-hmi-debug.apk
          path: temp_app/com.gear.megacontrol/platforms/android/app/build/outputs/apk/debug/app-debug.apk
