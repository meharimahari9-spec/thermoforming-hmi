name: Build Thermoforming HMI APK

on:
  workflow_dispatch: # Allows manual trigger
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Create Cordova Project Structure
        run: |
          # Create a temporary directory for the app
          mkdir -p temp_app
          cd temp_app
          
          # Initialize Cordova App
          cordova create com.thermo.hmi "Thermoforming HMI"
          cd com.thermo.hmi
          
          # Copy your custom index.html into the www folder
          # Assumes index.html is in the root of your repo
          cp ../../index.html ./www/index.html
          
          # Add Android Platform
          cordova platform add android@13
          
          # Add Serial Plugin (for USB communication)
          cordova plugin add cordovarduino
          
          # Configure Preferences in config.xml
          # Orientation: Landscape, Fullscreen: True, Min SDK: 24
          sed -i 's#</widget>#<preference name="Orientation" value="landscape" />\n<preference name="Fullscreen" value="true" />\n<preference name="android-minSdkVersion" value="24" />\n<preference name="android-targetSdkVersion" value="30" />\n</widget>#' config.xml
          
          # Optional: Add Icon if you have one (skipped for simplicity here)

      - name: Build Debug APK
        working-directory: temp_app/com.thermo.hmi
        run: cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thermoforming-hmi-debug.apk
          path: temp_app/com.thermo.hmi/platforms/android/app/build/outputs/apk/debug/app-debug.apk
