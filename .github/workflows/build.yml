name: Build Thermoforming HMI APK

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Create Cordova Project Structure
        run: |
          # 1. Create directory structure
          mkdir -p temp_app
          cd temp_app
          
          # 2. Initialize Cordova App with a VALID Package Name
          # Changed from com.thermo.hmi to com.gearengineering.thermoform
          # This avoids the "reserved word" error.
          cordova create com.gearengineering.thermoform "Thermoforming HMI"
          
          # 3. Enter the project folder
          cd com.gearengineering.thermoform
          
          # 4. Copy your custom index.html into the www folder
          # Assumes index.html is in the root of your repo
          cp ../../index.html ./www/index.html
          
          # 5. Add Android Platform
          cordova platform add android@13
          
          # 6. Add Serial Plugin (for USB communication)
          cordova plugin add cordovarduino
          
          # 7. Configure Preferences in config.xml
          # Orientation: Landscape, Fullscreen: True, Min SDK: 24
          sed -i 's#</widget>#<preference name="Orientation" value="landscape" />\n<preference name="Fullscreen" value="true" />\n<preference name="android-minSdkVersion" value="24" />\n<preference name="android-targetSdkVersion" value="30" />\n</widget>#' config.xml

      - name: Build Debug APK
        working-directory: temp_app/com.gearengineering.thermoform
        run: cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thermoforming-hmi-debug.apk
          path: temp_app/com.gearengineering.thermoform/platforms/android/app/build/outputs/apk/debug/app-debug.apk
